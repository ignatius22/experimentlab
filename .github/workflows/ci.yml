name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client (Pinned v5)
        run: pnpm --filter @experiment/db build

      - name: Build Internal Packages
        run: pnpm --filter @experiment/schemas build && pnpm --filter @experimentlab/core build && pnpm --filter @experimentlab/react build

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Application
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://experiment_user:test_pwd@localhost:5432/experimentlab_db?schema=public"
          AUTH_SECRET: "ci_test_jwt_secret_key_849204918239"
          NODE_ENV: "production"

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install & Build Standalone Output
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @experiment/db build
          pnpm --filter @experiment/schemas build
          pnpm --filter @experimentlab/core build
          pnpm --filter @experimentlab/react build
          pnpm build
        env:
          DATABASE_URL: "postgresql://experiment_user:test_pwd@localhost:5432/experimentlab_db?schema=public"
          AUTH_SECRET: "ci_test_jwt_secret_key_849204918239"
          NODE_ENV: "production"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: experimentlab:ci-test

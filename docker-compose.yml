services:
  redis:
    image: redis:7-alpine
    container_name: experimentlab_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - experimentlab_redisdata:/data
    networks:
      - experimentlab_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: experimentlab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-experiment_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable is required}"
      POSTGRES_DB: "${POSTGRES_DB:-experimentlab_db}"
    volumes:
      - experimentlab_pgdata:/var/lib/postgresql/data
    networks:
      - experimentlab_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-experiment_user} -d ${POSTGRES_DB:-experimentlab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: experimentlab_web
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Error: DATABASE_URL environment variable is required}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      AUTH_SECRET: "${AUTH_SECRET:?Error: AUTH_SECRET environment variable is required}"
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3005}"
    ports:
      - "0.0.0.0:3005:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - experimentlab_net

  worker:
    # The worker uses the same application image as web; PROCESS_ROLE selects its entrypoint.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: experimentlab_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Error: DATABASE_URL environment variable is required}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      EVENT_WORKER_CONCURRENCY: "${EVENT_WORKER_CONCURRENCY:-20}"
      EVENT_WORKER_BATCH_SIZE: "${EVENT_WORKER_BATCH_SIZE:-500}"
      EVENT_WORKER_FLUSH_MS: "${EVENT_WORKER_FLUSH_MS:-250}"
      PROCESS_ROLE: "worker"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - experimentlab_net

volumes:
  experimentlab_pgdata:
  experimentlab_redisdata:

networks:
  experimentlab_net:
    driver: bridge
